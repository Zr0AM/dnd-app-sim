name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-java-gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build & Test
        run: ./gradlew build --no-daemon

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/build/test-results/test/TEST-*.xml'

      - name: Upload JaCoCo Coverage
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: sim-service/build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml
          retention-days: 7
          if-no-files-found: error

      - name: Upload Boot JAR Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sim-service-jar
          path: sim-service/build/libs/sim-service-*.jar
          retention-days: 1
          if-no-files-found: error

  package-and-tag:
    name: Package and Tag Release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - name: Refuse to tag an old commit
        if: github.run_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::main is now at ${tip:0:7}; re-running this run would tag older commit ${GITHUB_SHA:0:7}. Aborting."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Boot JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: sim-service-jar
          path: dist

      - name: Tag and Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v0.1.${{ github.run_number }}"
          echo "Packaging release $VERSION for commit $GITHUB_SHA"
          
          cd dist
          sha256sum *.jar > checksums.txt
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          
          gh release create "$VERSION" *.jar checksums.txt \
            --title "Release $VERSION" \
            --generate-notes
