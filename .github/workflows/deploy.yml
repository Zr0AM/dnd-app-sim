name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Explicit bash adds -o pipefail, so a failing command piped into tee fails its step.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-java-gradle

      - name: Gradle check
        run: ./gradlew check --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Worker type check and tests
        working-directory: worker
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # Credentials come from the production environment (secret CF_API_TOKEN, variables CF_ACCOUNT_ID and
    # CF_D1_DATABASE_ID) and the SIM_API_KEYS repository secret.
    env:
      D1_DATABASE: dnd-app-sim
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --ignore-scripts

      # Uses the CF_D1_DATABASE_ID variable, else finds the database by name, creating it if missing.
      # sim_report is created on first use.
      - name: Provision D1
        id: d1
        env:
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || {
            echo "::error::Set the production environment secret CF_API_TOKEN and variable CF_ACCOUNT_ID"; exit 1; }
          if [ -n "$CF_D1_DATABASE_ID" ]; then
            echo "id=$CF_D1_DATABASE_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          id="$(curl -fsS -H "$auth" "$api?name=$D1_DATABASE" | jq -r --arg n "$D1_DATABASE" '.result[] | select(.name == $n) | .uuid')"
          if [ -z "$id" ]; then
            id="$(curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
              -d "$(jq -n --arg n "$D1_DATABASE" '{name: $n}')" "$api" | jq -r '.result.uuid')"
            echo "Created D1 database $D1_DATABASE"
          fi
          [ -n "$id" ] && [ "$id" != null ] || { echo "::error::Could not find or create D1 database $D1_DATABASE"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # Builds the repository-root Dockerfile, pushes the image to the Cloudflare registry and deploys the Worker with its
      # secrets, which the Worker hands to the container as environment variables.
      - name: wrangler deploy
        id: deploy
        working-directory: worker
        env:
          SIM_API_KEYS: ${{ secrets.SIM_API_KEYS }}
          CF_D1_DATABASE_ID: ${{ steps.d1.outputs.id }}
        run: |
          [ -n "$SIM_API_KEYS" ] || { echo "::error::Set the SIM_API_KEYS repository secret (comma-separated API keys)"; exit 1; }
          secrets="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          jq -n --arg account "$CLOUDFLARE_ACCOUNT_ID" --arg db "$CF_D1_DATABASE_ID" --arg token "$CLOUDFLARE_API_TOKEN" \
            --arg keys "$SIM_API_KEYS" \
            '{CF_ACCOUNT_ID: $account, CF_D1_DATABASE_ID: $db, CF_API_TOKEN: $token, SIM_API_KEYS: $keys}' > "$secrets"
          npm run deploy -- --secrets-file "$secrets" | tee "$RUNNER_TEMP/deploy.log"
          url="$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1)"
          [ -n "$url" ] || { echo "::error::wrangler deploy printed no workers.dev URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        working-directory: worker
        env:
          SIM_API_KEYS: ${{ secrets.SIM_API_KEYS }}
        run: SIM_API_KEY="${SIM_API_KEYS%%,*}" scripts/smoke-test.sh "${{ steps.deploy.outputs.url }}"
