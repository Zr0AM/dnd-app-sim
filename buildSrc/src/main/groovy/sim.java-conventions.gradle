// Shared by every module: Java 21, the Spring Boot BOM for versions, JUnit 5 with AssertJ, and a JaCoCo report per module.
plugins {
    id 'java'
    id 'jacoco'
    id 'pmd'
}

def libs = extensions.getByType(VersionCatalogsExtension).named('libs')

group = 'org.omnomnom.dnd'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(libs.findLibrary('spring-boot-bom').get())
    testImplementation libs.findLibrary('junit-jupiter').get()
    testImplementation libs.findLibrary('assertj-core').get()
    testImplementation libs.findLibrary('awaitility').get()
    testRuntimeOnly libs.findLibrary('junit-platform-launcher').get()
}

plugins.withId('java-test-fixtures') {
    dependencies {
        testFixturesImplementation platform(libs.findLibrary('spring-boot-bom').get())
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters' << '-Xlint:all'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = libs.findVersion('jacoco').get().requiredVersion
}

tasks.named('jacocoTestReport') {
    reports {
        xml.required = true
        html.required = true
    }
}

// Static analysis mirroring the SonarCloud rules this project fixes; the rulesets live in config/pmd. Production code gets
// the full set; tests and test fixtures only the hygiene rules.
pmd {
    toolVersion = libs.findVersion('pmd').get().requiredVersion
    ignoreFailures = false
    consoleOutput = true
    incrementalAnalysis = true
    ruleSets = [] // no Gradle default rules: only the files below
}

tasks.withType(Pmd).configureEach {
    ruleSetFiles = files(rootProject.file(name == 'pmdMain' ? 'config/pmd/main.xml' : 'config/pmd/test.xml'))
}
