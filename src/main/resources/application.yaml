spring:
  application:
    name: dnd-app-sim
  threads:
    virtual:
      enabled: false # simulation work is CPU-bound; it runs on a dedicated bounded executor

management:
  endpoints:
    web:
      exposure:
        include: health,info

sim:
  # Where finished RunReports are persisted: "filesystem" or "d1".
  report-store:
    type: filesystem
    directory: ${SIM_REPORT_DIR:out/reports}
  # Cloudflare D1 is reached over its HTTP query API (there is no JDBC driver or wire protocol).
  # Credentials come from the environment and are never committed.
  d1:
    enabled: false
    base-url: https://api.cloudflare.com/client/v4
    account-id: ${CF_ACCOUNT_ID:}
    database-id: ${CF_D1_DATABASE_ID:}
    api-token: ${CF_API_TOKEN:}
    timeout: 30s
  # Dedicated executor for CPU-bound simulation/optimization work (0 = available processors).
  executor:
    threads: 0
    queue-capacity: 64
    busy-retry-after: 5s # Retry-After when the queue is full
  jobs:
    retained-finished: 200 # finished jobs kept for polling (jobs live in memory)
    campaign-days: 12 # days for an optimization's campaign pass and the default for report annotation
    expose-error-detail: false # keep exception messages (paths, upstream errors) out of job responses
